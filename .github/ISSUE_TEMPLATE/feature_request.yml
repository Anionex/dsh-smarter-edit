name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What coding or file-editing workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you want, including any Codex-grammar or DSH compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, such as native edit or an external patch step.
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Engine or parser
        - Transaction behavior
        - DSH integration
        - Native diff card
        - Packaging or documentation
        - Other
    validations:
      required: true
